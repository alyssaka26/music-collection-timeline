  <body>
    <main class="app">
      <header><div><p class="eyebrow" id="eyebrow">MY 2,000 SONGS</p><h1 id="page-title">每一首，都有它的去处</h1></div><div class="header-actions"><button class="mode-toggle" id="mode-toggle" type="button" aria-pressed="false"><span class="mode-icon">↔</span><span>时间轴</span></button><p class="total">2,000 songs</p></div></header>
      <p class="hint" id="hint">按听歌时刻自动归类 · 点开任一叠</p>
      <section class="shelves" id="shelves" aria-label="两千首歌曲的自动分类"></section>
      <nav class="category-tabs" id="category-tabs" aria-label="选择收藏分类维度"><button class="category-tab" type="button" aria-selected="true" data-group="suggested">建议</button><button class="category-tab" type="button" aria-selected="false" data-group="artist">歌手</button><button class="category-tab" type="button" aria-selected="false" data-group="time">时间</button><button class="category-tab" type="button" aria-selected="false" data-group="genre">流派</button></nav>
      <section class="timeline-view" id="timeline-view" aria-label="按月查看收藏歌曲"><p class="timeline-note">横向浏览当年月份 · 底部时间尺可跳转至 2018—2026</p><div class="timeline-scroll"><div class="timeline-canvas" id="timeline-canvas"></div></div><nav class="year-scrubber" id="year-scrubber" aria-label="按年份浏览收藏"></nav><p class="selected-month" id="selected-month" aria-live="polite"></p></section>
    </main>
    <dialog class="focus-dialog" id="focus-dialog" aria-labelledby="focus-title"><section class="focus-sheet"><button class="focus-close" id="focus-close" type="button" aria-label="关闭">×</button><p class="focus-kicker">COLLECTION FOCUS</p><h2 class="focus-title" id="focus-title"></h2><p class="focus-note" id="focus-note"></p><p class="focus-count" id="focus-count"></p><div class="focus-covers" id="focus-covers"></div></section></dialog>

      const focusDialog=document.getElementById('focus-dialog'),focusTitle=document.getElementById('focus-title'),focusNote=document.getElementById('focus-note'),focusCount=document.getElementById('focus-count'),focusCovers=document.getElementById('focus-covers');
      function closeFocus(){if(focusDialog.classList.contains('fallback-open')){focusDialog.removeAttribute('open');focusDialog.classList.remove('fallback-open');document.querySelector('.app').classList.remove('is-blurred');}else if(typeof focusDialog.close==='function')focusDialog.close();}
      function openFocus(groupName,index){const [title,note,count]=categorySets[groupName][index];const groupOffset=['suggested','artist','time','genre'].indexOf(groupName)*17;const covers=coverPool.length?coverPool:artworks;focusTitle.textContent=title;focusNote.textContent=note;focusCount.textContent=`${count} 首收藏`;focusCovers.innerHTML=[0,1,2,3].map(n=>`<span class="focus-cover"><img src="${covers[(index*4+n+groupOffset)%covers.length]}" alt="${title}中的专辑封面" /></span>`).join('');if(typeof focusDialog.showModal==='function')focusDialog.showModal();else{focusDialog.setAttribute('open','');focusDialog.classList.add('fallback-open');document.querySelector('.app').classList.add('is-blurred');}}
      shelves.addEventListener('click', (event) => { const card=event.target.closest('.collection'); if(!card)return; const willOpen=card.getAttribute('aria-expanded')!=='true'; document.querySelectorAll('.collection').forEach(item=>item.setAttribute('aria-expanded','false')); card.setAttribute('aria-expanded',String(willOpen)); });
      document.getElementById('focus-close').addEventListener('click',closeFocus);focusDialog.addEventListener('click',event=>{if(event.target===focusDialog)closeFocus();});
      document.getElementById('category-tabs').addEventListener('click', (event) => { const tab=event.target.closest('.category-tab'); if(!tab)return; activeGroup=tab.dataset.group; document.querySelectorAll('.category-tab').forEach(item=>item.setAttribute('aria-selected','false')); tab.setAttribute('aria-selected','true'); renderGroups(activeGroup); });
      const yearTotals = {2018:89,2019:144,2020:196,2021:238,2022:286,2023:301,2024:282,2025:324,2026:140};
      const years = Object.keys(yearTotals).map(Number);
      let activeYear = 2026;
      let timelineCoverPool = [];
      const timelineCanvas = document.getElementById('timeline-canvas');
      const yearScrubber = document.getElementById('year-scrubber');
      const selectedMonth = document.getElementById('selected-month');
      const timelineScroll = document.querySelector('.timeline-scroll');
      function getMonths(year) {
        const monthCount = year === 2026 ? 8 : 12;
        const base = Math.floor(yearTotals[year] / monthCount);
        const variation = [0,2,-1,1,-2,2,0,-1,1,-2,1,0].slice(0,monthCount);
        const counts = variation.map(amount => base + amount);
        counts[0] += yearTotals[year] - counts.reduce((sum, amount) => sum + amount, 0);
        return counts.map((count,index) => [`${year}.${String(index + 1).padStart(2,'0')}`,count]);
      }
      const allMonths = years.flatMap(year => getMonths(year).map(([month,count]) => ({year,month,count})));
      const demoSongCount = allMonths.reduce((sum,month) => sum + month.count, 0);
      let activeMonthIndex = allMonths.findIndex(item => item.month === '2026.01');
      function renderYearScrubber() {
        selectedMonth.textContent = allMonths[activeMonthIndex].month;
        const monthTicks = allMonths.map((item,index) => `<button class="month-tick${item.month.endsWith('.01') ? ' is-year' : ''}" type="button" data-month-index="${index}" style="--position:${index / (allMonths.length - 1) * 100}%" aria-selected="${index === activeMonthIndex}" aria-label="定位到 ${item.month}，${item.count} 首收藏"></button>`).join('');
        const yearTicks = years.map(year => { const index = allMonths.findIndex(item => item.year === year); return `<button class="year-tick" type="button" data-year="${year}" style="--position:${index / (allMonths.length - 1) * 100}%" aria-selected="${year === activeYear}" aria-label="定位到 ${year} 年，共 ${yearTotals[year]} 首收藏">${year}</button>`; }).join('');
        yearScrubber.innerHTML = `<span class="scrubber-track">${monthTicks}</span>${yearTicks}`;
      }
      function renderTimeline(covers) {
        let cursor = 0;
        timelineCanvas.style.width = `${allMonths.length * 174 + 160}px`;
        timelineCanvas.setAttribute('aria-label',`2018 至 2026 的 ${demoSongCount} 首收藏歌曲时间线`);
        timelineCanvas.innerHTML = allMonths.map(({month,count},monthIndex) => {
          const x = 86 + monthIndex * 174;
          const images = Array.from({length:count},(_,songIndex) => {
            const column = songIndex % 5;
            const row = Math.floor(songIndex / 5);
            const dx = (column - 2) * 24;
            const y = row % 2 === 0 ? 80 + Math.floor(row / 2) * 47 : 265 + Math.floor(row / 2) * 47;
            const r = ((songIndex * 7 + monthIndex * 3) % 9) - 4;
            const src = covers[cursor++ % covers.length];
            return `<span class="month-cover" style="left:${x+dx}px;top:${y}px;transform:rotate(${r}deg)"><img loading="lazy" src="${src}" alt="${month} 收藏歌曲 ${songIndex + 1}" /></span>`;
          }).join('');
          return `<div class="month-guide" style="left:${x}px"></div><div class="month-copy" style="left:${x-8}px"><strong>${month}</strong><span>${count} 首收藏</span></div>${images}`;
        }).join('');
      }
      function setActiveMonth(index,{behavior='smooth'}={}) {
        activeMonthIndex = Math.max(0,Math.min(allMonths.length - 1,index));
        activeYear = allMonths[activeMonthIndex].year;
        renderYearScrubber();
        timelineScroll.scrollTo({left:activeMonthIndex * 174,behavior});
      }
      function setActiveYear(year,options) {
        const firstMonth = allMonths.findIndex(item => item.year === year);
        if (firstMonth >= 0) setActiveMonth(firstMonth,options);
      }
      renderYearScrubber();
      yearScrubber.addEventListener('click', event => { const monthTick = event.target.closest('.month-tick'); if (monthTick) { setActiveMonth(Number(monthTick.dataset.monthIndex)); return; } const yearTick = event.target.closest('.year-tick'); if (yearTick) setActiveYear(Number(yearTick.dataset.year)); });
      let activePointer = null;
      function monthAtPointer(event) { const bounds = yearScrubber.getBoundingClientRect(); const ratio = Math.max(0,Math.min(1,(event.clientX - bounds.left - 20) / Math.max(1,bounds.width - 40))); return Math.round(ratio * (allMonths.length - 1)); }
      function endYearDrag(event) { if (event.pointerId !== activePointer) return; activePointer = null; yearScrubber.classList.remove('is-dragging'); }
      yearScrubber.addEventListener('pointerdown', event => { if (event.pointerType === 'mouse' && event.button !== 0) return; activePointer = event.pointerId; yearScrubber.setPointerCapture(event.pointerId); yearScrubber.classList.add('is-dragging'); event.preventDefault(); setActiveMonth(monthAtPointer(event),{behavior:'auto'}); });
      yearScrubber.addEventListener('pointermove', event => { if (event.pointerId === activePointer) setActiveMonth(monthAtPointer(event),{behavior:'auto'}); });
      yearScrubber.addEventListener('pointerup',endYearDrag);
      yearScrubber.addEventListener('pointercancel',endYearDrag);
      let scrollFrame = 0;
      timelineScroll.addEventListener('scroll', () => { if (scrollFrame) return; scrollFrame = requestAnimationFrame(() => { scrollFrame = 0; const monthIndex = Math.max(0,Math.min(allMonths.length - 1,Math.round(timelineScroll.scrollLeft / 174))); if (monthIndex !== activeMonthIndex) { activeMonthIndex = monthIndex; activeYear = allMonths[monthIndex].year; renderYearScrubber(); } }); });
      timelineCanvas.innerHTML = '<p style="padding:220px 0 0 85px;color:#99958e;font-family:var(--hand);font-size:15px">正在整理每个月收藏的不同封面…</p>';
      Promise.all(['us','gb','cn','jp','kr'].map(country => fetch(`https://coverbox.henry-hu.com/charts-api?country=${country}`).then(response => response.ok ? response.json() : Promise.reject())))
        .then(results => {
          const covers = [...new Set(results.flat().map(item => item.artwork))];
          const required = 60;
          if (covers.length < required) throw new Error('not enough unique covers');
          coverPool = covers;
          timelineCoverPool = covers;
          renderGroups(activeGroup);
          renderTimeline(covers);
          requestAnimationFrame(() => setActiveYear(activeYear,{behavior:'auto'}));
        })
        .catch(() => { timelineCanvas.innerHTML = '<p style="padding:220px 0 0 85px;color:#99958e;font-family:var(--hand);font-size:15px">封面暂时无法整理，请稍后刷新。</p>'; });
      const app = document.querySelector('.app'), toggle = document.getElementById('mode-toggle'), title = document.getElementById('page-title'), eyebrow = document.getElementById('eyebrow'), hint = document.getElementById('hint');
      toggle.addEventListener('click', () => { const isTimeline=!app.classList.contains('timeline'); app.classList.toggle('timeline',isTimeline); toggle.setAttribute('aria-pressed',String(isTimeline)); toggle.innerHTML=isTimeline?'<span class="mode-icon">⊞</span><span>分类视图</span>':'<span class="mode-icon">↔</span><span>时间轴</span>'; eyebrow.textContent=isTimeline?'SAVED BY MONTH':'MY 2,000 SONGS'; title.textContent=isTimeline?'我的收藏历年图谱':'每一首，都有它的去处'; hint.textContent=isTimeline?'2018—2026 · 底部时间尺切换年份':'按听歌时刻自动归类 · 点开任一叠'; });
    </script>
  </body>
</html>
