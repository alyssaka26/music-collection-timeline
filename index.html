        dealTimeline=window.gsap.timeline({defaults:{ease:'power2.out'},onComplete:()=>{window.gsap.set([...targetArts,...allCopies],{autoAlpha:1});dealIntro.innerHTML='';dealTimeline=null;}})
          .addLabel('spread',0)

      }
      function closeFocus(){dealTimeline?.kill();dealTimeline=null;focusSheet.classList.remove('is-dealing');if(window.gsap)window.gsap.set([dealIntro,...dealTargets],{clearProps:'opacity,visibility'});dealTargets=[];dealIntro.innerHTML='';if(focusDialog.classList.contains('fallback-open')){focusDialog.removeAttribute('open');focusDialog.classList.remove('fallback-open');document.querySelector('.app').classList.remove('is-blurred');}else if(typeof focusDialog.close==='function')focusDialog.close();}
      function openFocus(groupName,index,sourcePile){const source=sourcePile?{pile:sourcePile.getBoundingClientRect(),covers:Array.from(sourcePile.querySelectorAll('.cover')).map(cover=>({src:cover.querySelector('img').src,rect:cover.getBoundingClientRect(),rotation:parseFloat(getComputedStyle(cover).getPropertyValue('--r'))||0}))}:null;const [title,,count,isNewUnlock,savedRecommendations=[]]=categorySets[groupName][index];const groupOffset=['suggested','artist','time','genre'].indexOf(groupName)*17;focusedCollection={groupName,index,title,count,groupOffset,isNewUnlock,savedRecommendations};renderSongList();focusSheet.classList.add('is-dealing');if(!focusDialog.open){if(typeof focusDialog.showModal==='function')focusDialog.showModal();else{focusDialog.setAttribute('open','');focusDialog.classList.add('fallback-open');document.querySelector('.app').classList.add('is-blurred');}}runCollectionDeal(source);}
      function toggleGroupPlayback(groupName,index){const [title,,count]=categorySets[groupName][index],visibleCount=Math.min(count,50);const isPlaying=playingCollection?.groupName===groupName&&playingCollection.index===index;playingCollection=isPlaying?null:{groupName,index};playbackStatus.hidden=isPlaying;playbackStatus.textContent=isPlaying?'':`正在播放 · ${title} · ${visibleCount} 首歌曲`;renderGroups(activeGroup);}

      function animateRecommendationSave(sourceSnapshot,recommendationIndex){
        const targetRow=songList.querySelector(`[data-saved-track="${recommendationIndex}"]`),targetArt=targetRow?.querySelector('.song-art'),targetCopy=targetRow?.querySelector('.song-copy');
        if(!window.gsap||window.matchMedia('(prefers-reduced-motion: reduce)').matches||!sourceSnapshot||!targetArt)return;
        const sheetRect=focusSheet.getBoundingClientRect(),sourceRect=sourceSnapshot.rect,targetRect=targetArt.getBoundingClientRect();
        const flyingCover=document.createElement('span');
        flyingCover.className='save-fly-cover';
        flyingCover.innerHTML=`<img src="${sourceSnapshot.src}" alt="" />`;
        flyingCover.style.left=`${sourceRect.left-sheetRect.left}px`;
        flyingCover.style.top=`${sourceRect.top-sheetRect.top}px`;
        flyingCover.style.width=`${sourceRect.width}px`;
        flyingCover.style.height=`${sourceRect.height}px`;

        window.gsap.set([targetArt,targetCopy],{autoAlpha:0});
        window.gsap.timeline({defaults:{ease:'power2.out'},onComplete:()=>{window.gsap.set([targetArt,targetCopy],{clearProps:'opacity,visibility'});flyingCover.remove();}})

      function saveRecommendation(recommendationIndex,sourceRow,sourceType='default'){const collection=focusedCollection&&categorySets[focusedCollection.groupName][focusedCollection.index];if(!collection||collection[2]>=50)return;const sourceTracks=sourceType==='artist'?getTracksForGroup('artist',focusedCollection.title):recommendationTracks,recommendation=sourceTracks[recommendationIndex];if(!recommendation)return;const {title,artist,artwork}=recommendation,savedRecommendations=collection[4]||(collection[4]=[]),sourceArt=sourceRow?.querySelector('.song-art'),sourceSnapshot=sourceArt?{rect:sourceArt.getBoundingClientRect(),src:sourceArt.querySelector('img')?.src}:null;if(savedRecommendations.some(track=>track.title===title))return;savedRecommendations.push({title,artist,artwork,recommendationIndex});collection[2]+=1;focusedCollection.count=collection[2];focusedCollection.savedRecommendations=savedRecommendations;renderSongList();renderGroups(activeGroup);animateRecommendationSave(sourceSnapshot,recommendationIndex);}
      document.getElementById('focus-back').addEventListener('click',closeFocus);focusDialog.addEventListener('click',event=>{if(event.target===focusDialog)closeFocus();});songList.addEventListener('click',event=>{const saveButton=event.target.closest('.save-recommendation');if(saveButton)saveRecommendation(Number(saveButton.dataset.recommendationIndex),saveButton.closest('.recommendation-row'),saveButton.dataset.recommendationSource);});
      document.getElementById('category-tabs').addEventListener('click', (event) => { const tab=event.target.closest('.category-tab'); if(!tab)return; activeGroup=tab.dataset.group; document.querySelectorAll('.category-tab').forEach(item=>item.setAttribute('aria-selected','false')); tab.setAttribute('aria-selected','true'); renderGroups(activeGroup); });
      const yearTotals = {2018:89,2019:144,2020:196,2021:238,2022:286,2023:301,2024:282,2025:324,2026:140};
      const years = Object.keys(yearTotals).map(Number);
      let activeYear = 2026;
      let timelineCoverPool = [];
      const timelineCanvas = document.getElementById('timeline-canvas');
      const yearScrubber = document.getElementById('year-scrubber');
      const selectedMonth = document.getElementById('selected-month');
      const timelineScroll = document.querySelector('.timeline-scroll');
      function getMonths(year) {
        const monthCount = year === 2026 ? 8 : 12;
        const base = Math.floor(yearTotals[year] / monthCount);
        const variation = [0,2,-1,1,-2,2,0,-1,1,-2,1,0].slice(0,monthCount);
        const counts = variation.map(amount => base + amount);
        counts[0] += yearTotals[year] - counts.reduce((sum, amount) => sum + amount, 0);
        return counts.map((count,index) => [`${year}.${String(index + 1).padStart(2,'0')}`,count]);
      }
      const allMonths = years.flatMap(year => getMonths(year).map(([month,count]) => ({year,month,count})));
      const demoSongCount = allMonths.reduce((sum,month) => sum + month.count, 0);
      const monthStories = [
        '看起来是断舍离的一个月，你与过去记忆中爱过的歌缓缓告别。快节奏的生活里，缓拍带来了瞬间的豁达通透。',
        '你的红心足迹跨过两座城市，在深夜与清晨各留下几枚红心，收藏列表成了你的旅行手账。',
        '这些心动被一条柔软的线串起，把这个月的碎片缝成了一张完整的音乐地图。',
        '你在这个月做了大幅度的整理，旧爱被轻轻移出，只留下真正心动的歌。断舍离的背后，是一次更清晰的自我认知。',
        '摇滚的躁动从列表里淡出，钢琴曲的安静取而代之，你的收藏从呐喊转向倾听。'
      ];
      let activeMonthIndex = allMonths.findIndex(item => item.month === '2026.01');
      function updateTimelineSelection(){timelineCanvas.querySelectorAll('[data-month-index]').forEach(node=>node.classList.toggle('is-active',Number(node.dataset.monthIndex)===activeMonthIndex));}
      function renderYearScrubber() {
        selectedMonth.textContent = allMonths[activeMonthIndex].month;
        const monthTicks = allMonths.map((item,index) => `<button class="month-tick${item.month.endsWith('.01') ? ' is-year' : ''}" type="button" data-month-index="${index}" style="--position:${index / (allMonths.length - 1) * 100}%" aria-selected="${index === activeMonthIndex}" aria-label="定位到 ${item.month}，${item.count} 首收藏"></button>`).join('');
        const yearTicks = years.map(year => { const index = allMonths.findIndex(item => item.year === year); return `<button class="year-tick" type="button" data-year="${year}" style="--position:${index / (allMonths.length - 1) * 100}%" aria-selected="${year === activeYear}" aria-label="定位到 ${year} 年，共 ${yearTotals[year]} 首收藏">${year}</button>`; }).join('');
        yearScrubber.innerHTML = `<span class="scrubber-track">${monthTicks}</span>${yearTicks}`;
      }
      function renderTimeline(covers) {
        let cursor = 0;
        timelineCanvas.style.width = `${allMonths.length * 174 + 160}px`;
        timelineCanvas.setAttribute('aria-label',`2018 至 2026 的 ${demoSongCount} 首收藏歌曲时间线`);
        timelineCanvas.innerHTML = allMonths.map(({month,count},monthIndex) => {
          const x = 86 + monthIndex * 174;
          const images = Array.from({length:count},(_,songIndex) => {
            const playCount = Math.max(3,84 - songIndex * 2 - (monthIndex * 3 % 11));
            const compactIndex = Math.max(0,songIndex - 3);
            const column = compactIndex % 4;
            const row = Math.floor(compactIndex / 4);
            const gridCount = Math.max(0,count - 3);
            const rowLength = Math.min(4,gridCount - row * 4);
            const alignedColumn = rowLength > 1 ? column * 3 / (rowLength - 1) : 0;
            const size = songIndex === 0 ? 64 : songIndex < 3 ? 30 : 22;
            const dx = songIndex === 0 ? -60 : songIndex === 1 ? 30 : songIndex === 2 ? 30 : -60 + alignedColumn * (98 / 3);
            const y = songIndex === 0 ? 74 : songIndex === 1 ? 74 : songIndex === 2 ? 112 : 154 + row * 24;
            const r = 0;
            const src = covers[cursor++ % covers.length];
            return `<span class="month-cover" data-month-index="${monthIndex}" style="left:${x+dx}px;top:${y}px;width:${size}px;transform:rotate(${r}deg)"><img loading="lazy" src="${src}" alt="${month} 收藏歌曲 ${songIndex + 1}，听过 ${playCount} 次" /></span>`;
          }).join('');
          return `<div class="month-guide" data-month-index="${monthIndex}" style="left:${x + 87}px"></div><div class="month-copy" data-month-index="${monthIndex}" style="left:${x + 87}px"><strong>${month}</strong><span>${count} 首收藏</span><p class="month-story">${monthStories[monthIndex % monthStories.length]}</p></div>${images}`;
        }).join('');

      function setActiveMonth(index,{behavior='smooth'}={}) {

        timelineScroll.scrollTo({left:activeMonthIndex * 174,behavior});

      renderYearScrubber();
      yearScrubber.addEventListener('click', event => { const monthTick = event.target.closest('.month-tick'); if (monthTick) { setActiveMonth(Number(monthTick.dataset.monthIndex)); return; } const yearTick = event.target.closest('.year-tick'); if (yearTick) setActiveYear(Number(yearTick.dataset.year)); });
      let activePointer = null;
      function monthAtPointer(event) { const bounds = yearScrubber.getBoundingClientRect(); const ratio = Math.max(0,Math.min(1,(event.clientX - bounds.left - 20) / Math.max(1,bounds.width - 40))); return Math.round(ratio * (allMonths.length - 1)); }
      function endYearDrag(event) { if (event.pointerId !== activePointer) return; activePointer = null; yearScrubber.classList.remove('is-dragging'); }
      yearScrubber.addEventListener('pointerdown', event => { if (event.pointerType === 'mouse' && event.button !== 0) return; activePointer = event.pointerId; yearScrubber.setPointerCapture(event.pointerId); yearScrubber.classList.add('is-dragging'); event.preventDefault(); setActiveMonth(monthAtPointer(event),{behavior:'auto'}); });
      yearScrubber.addEventListener('pointermove', event => { if (event.pointerId === activePointer) setActiveMonth(monthAtPointer(event),{behavior:'auto'}); });
      yearScrubber.addEventListener('pointerup',endYearDrag);
      yearScrubber.addEventListener('pointercancel',endYearDrag);
      let scrollFrame = 0;
      timelineScroll.addEventListener('scroll', () => { if (scrollFrame) return; scrollFrame = requestAnimationFrame(() => { scrollFrame = 0; const monthIndex = Math.max(0,Math.min(allMonths.length - 1,Math.round(timelineScroll.scrollLeft / 174))); if (monthIndex !== activeMonthIndex) { activeMonthIndex = monthIndex; activeYear = allMonths[monthIndex].year; renderYearScrubber(); updateTimelineSelection(); } }); });
      timelineCanvas.innerHTML = '<p style="padding:220px 0 0 85px;color:#99958e;font-family:var(--hand);font-size:15px">正在整理每个月收藏的不同封面…</p>';
      Promise.all(['us','gb','cn','jp','kr'].map(country => fetch(`https://coverbox.henry-hu.com/charts-api?country=${country}`).then(response => response.ok ? response.json() : Promise.reject())))

          coverPool = covers;

        .catch(() => { timelineCanvas.innerHTML = '<p style="padding:220px 0 0 85px;color:#99958e;font-family:var(--hand);font-size:15px">封面暂时无法整理，请稍后刷新。</p>'; });
      const app = document.querySelector('.app'), toggle = document.getElementById('mode-toggle'), title = document.getElementById('page-title'), eyebrow = document.getElementById('eyebrow'), hint = document.getElementById('hint');
      toggle.addEventListener('click', () => { const isTimeline=!app.classList.contains('timeline'); app.classList.toggle('timeline',isTimeline); toggle.setAttribute('aria-pressed',String(isTimeline)); toggle.innerHTML=isTimeline?'<span class="mode-icon">⊞</span><span>分类视图</span>':'<span class="mode-icon">↔</span><span>时间轴</span>'; eyebrow.textContent=isTimeline?'SAVED BY MONTH':'MY 2,000 SONGS'; title.textContent=isTimeline?'我的收藏历年图谱':'我的收藏夹'; hint.textContent=isTimeline?'2018—2026 · 底部时间尺切换年份':'按听歌时刻自动归类 · 点开任一叠'; });
